services:
  - type: web
    name: foodjs-demo
    runtime: docker
    rootDir: FoodJS
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: production
      - key: Jwt__Secret
        generateValue: true
      - key: BootstrapAdmin__Email
        value: admin@foodjs.demo
      - key: BootstrapAdmin__Password
        generateValue: true
      - key: DataProtection__KeyRingPath
        value: /tmp/foodjs-keys
